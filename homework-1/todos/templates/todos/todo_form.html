{% extends 'todos/base.html' %}

{% block content %}
<h1>{% if object %}Edit Todo{% else %}New Todo{% endif %}</h1>
<form method="post">
    {% csrf_token %}

    <label for="id_title">Title:</label>
    {{ form.title }}

    <label for="id_description">Description:</label>
    {{ form.description }}

    {% if object %}
    <div style="margin-bottom: 15px;">
        <label for="id_completed">Completed:</label>
        {{ form.completed }}
    </div>
    {% endif %}

    <button type="submit" class="btn">Save</button>
    <a href="{% url 'todo-list' %}" style="margin-left: 10px;">Cancel</a>
</form>
{% endblock %}
