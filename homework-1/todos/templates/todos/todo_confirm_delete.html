{% extends 'todos/base.html' %}

{% block content %}
<h1>Delete Todo?</h1>
<p>Are you sure you want to delete "{{ object.title }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn" style="background-color: #ff4d4d;">Confirm Delete</button>
    <a href="{% url 'todo-list' %}" style="margin-left: 10px;">Cancel</a>
</form>
{% endblock %}
